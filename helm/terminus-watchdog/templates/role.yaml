# Role: namespace-scoped — allows pod deletion for automated remediation
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terminus-watchdog-role
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "terminus-watchdog.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

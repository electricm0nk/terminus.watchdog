apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terminus-watchdog.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "terminus-watchdog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "terminus-watchdog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terminus-watchdog.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: watchdog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.health.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.health.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: watchdog-config
            - secretRef:
                name: watchdog-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
